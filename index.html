<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>プログラミングの基本</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

  <style>
    body {
      margin:0; padding:28px;
      font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","メイリオ",sans-serif;
      background:#f6f8fb; color:#222;
    }
    .container { max-width:960px; margin:0 auto; }

    .title {
      font-size:40px;
      font-weight:bold;
      margin-bottom:28px;
      padding-bottom:12px;
      border-bottom:3px solid #0078d4;
    }

    .card {
      background:#fff; padding:20px 24px;
      border-radius:10px; border:1px solid #dde3f0;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
      margin-bottom:24px;
    }

    textarea {
      width:100%;
      min-height:160px;
      font-family:Menlo,Consolas,monospace;
      font-size:15px;
      padding:12px 12px;
      box-sizing:border-box;
      border-radius:8px;
      border:1px solid #ccd6e6;
      background:#fbfbfb;
      resize:none;
      overflow:hidden;
    }

    .output, .result {
      margin-top:14px; padding:12px;
      border-radius:8px; white-space:pre-wrap;
      font-size:14px;
    }
    .output { background:#eef7ff; border:1px solid #cce0ff; }
    .result { background:#f7f9fc; border:1px solid #eef3fb; }

    .okmark {
      color:#1b5e20;
      font-size:18px;
      font-weight:bold;
      display:none;
      line-height:1;
      padding-top:2px;
    }

    .maru { color:#1b5e20; font-weight:bold; }
    .batsu { color:#c62828; font-weight:bold; }

    button {
      height:40px;
      padding:0 18px;
      border-radius:8px;
      border:0;
      cursor:pointer;
      font-size:16px;
      line-height:40px;
      margin-top:10px;
    }
    .btn-primary { background:#0078d4; color:#fff; }

    .overall {
      margin-top:20px;
      padding:28px;
      background:#fff;
      border-radius:12px;
      border:3px solid #aac8f0;
      box-shadow:0 6px 18px rgba(0,0,0,0.08);
      font-size:26px;
      font-weight:bold;
      white-space:pre-wrap;
      color:#999;
    }

    .log {
      margin-top:12px; font-size:12px; color:#666;
      background:#f3f5fb; padding:8px;
      border-radius:6px; border:1px solid #e1e6f5;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
<div class="container">

  <div class="title">プログラミングの基本</div>

  <!-- 問1 -->
  <div class="card">
    <h2>問1：Hello World を表示せよ</h2>
    <textarea id="q1Input" placeholder="print('Hello World')"></textarea>

    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn-primary" onclick="runQ1()">実行</button>
      <span id="q1OK" class="okmark">OK</span>
    </div>

    <div id="q1Output" class="output">出力結果がここに表示されます。</div>
    <div id="q1Result" class="result">得点がここに表示されます。</div>
  </div>

  <!-- 問2 -->
  <div class="card">
    <h2>問2：a=2, b=3 を使い a+b を表示せよ</h2>
    <textarea id="q2Input" placeholder="a = 2&#10;b = 3&#10;print(a + b)"></textarea>

    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn-primary" onclick="runQ2()">実行</button>
      <span id="q2OK" class="okmark">OK</span>
    </div>

    <div id="q2Output" class="output">出力結果がここに表示されます。</div>
    <div id="q2Result" class="result">得点がここに表示されます。</div>
  </div>

  <!-- 問3 -->
  <div class="card">
    <h2>問3：入力された2つの数値の合計を求めよ</h2>
    <textarea id="q3Input" placeholder="a = int(input())&#10;b = int(input())&#10;print(a + b)"></textarea>

    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn-primary" onclick="runQ3()">実行</button>
      <span id="q3OK" class="okmark">OK</span>
    </div>

    <div id="q3Output" class="output">出力結果がここに表示されます。</div>
    <div id="q3Result" class="result">得点がここに表示されます。</div>
  </div>

  <div id="resultBox" class="overall">総合結果がここに表示されます。</div>

  <div id="logBox" class="log">ログ: 初期化中…</div>

</div>

<script>
/* -------------------------
   SCORM API 初期化
------------------------- */
let API = null;

function findAPI() {
  let win = window;
  while (win.API == null && win.parent != null && win.parent != win) {
    win = win.parent;
  }
  API = win.API;
}

function initSCORM() {
  findAPI();
  if (API) API.LMSInitialize("");
}

function finishSCORM() {
  if (API) API.LMSFinish("");
}

window.onload = function() {
  initSCORM();
  loadSuspendData();
};
window.onunload = finishSCORM;

/* -------------------------
   Pyodide
------------------------- */
let pyodide = null;

/* 問3の a,b をランダム化 */
let aVal = Math.floor(Math.random() * 10) + 1;
let bVal = Math.floor(Math.random() * 10) + 1;

async function initPyodide() {
  pyodide = await loadPyodide();
}
initPyodide();

/* textarea 自動リサイズ */
document.addEventListener("input", e => {
  if(e.target.tagName.toLowerCase() === "textarea"){
    e.target.style.height = "auto";
    e.target.style.height = e.target.scrollHeight + "px";
  }
});

/* Python 実行 */
async function runPython(code, inputs=[]) {
  let output = "";
  pyodide.setStdout({ batched: data => output += data });

  const wrapped = `
def __student_main():
    import sys
    input_values = ${JSON.stringify(inputs)}
    def fake_input(prompt=""):
        return input_values.pop(0)
    __builtins__.input = fake_input
    try:
        exec("""${code.replace(/"/g,'\\"')}""")
    except Exception as e:
        print("ERROR:", e)
__student_main()
`;

  try { await pyodide.runPythonAsync(wrapped); }
  catch(e){ output += "ERROR: " + e.message; }

  return output.trim();
}

function mark(b){ return b ? '<span class="maru">○</span>' : '<span class="batsu">×</span>'; }

/* ---- 問1 ---- */
async function runQ1() {
  const code = q1Input.value;
  const out = await runPython(code);

  q1Output.textContent = out || "(出力なし)";

  const sPrint = /print\s*\(/.test(code);
  const sHello = /hello\s*world/i.test(out);
  const total = (sPrint?10:0)+(sHello?20:0);

  q1Result.innerHTML =
    `<span style="font-size:20px; font-weight:bold;">得点: ${total}/30</span>\n` +
    `・print を使っている: ${mark(sPrint)}（10点）\n` +
    `・Hello World を表示: ${mark(sHello)}（20点）`;

  q1OK.style.display = total===30 ? "inline" : "none";

  /* 解答詳細用：Q1 のコードを送信 */
  if (API) {
    API.LMSSetValue("cmi.interactions.0.id", "Q1");
    API.LMSSetValue("cmi.interactions.0.student_response", code);
    API.LMSSetValue(
      "cmi.interactions.0.result",
      (sPrint && sHello) ? "correct" : "wrong"
    );
  }

  updateOverall();
}

/* ---- 問2 ---- */
async function runQ2() {
  const code = q2Input.value;
  const out = await runPython(code);

  q2Output.textContent = out || "(出力なし)";

  const hasA = /a\s*=\s*2/.test(code);
  const usesAB = /a\s*\+\s*b/.test(code);
  const correct = out.includes("5");

  const total = (hasA?10:0)+(usesAB?10:0)+(correct?10:0);

  q2Result.innerHTML =
    `<span style="font-size:20px; font-weight:bold;">得点: ${total}/30</span>\n` +
    `・a=2 を使っている: ${mark(hasA)}（10点）\n` +
    `・a+b を使っている: ${mark(usesAB)}（10点）\n` +
    `・正しい出力（5）: ${mark(correct)}（10点）`;

  q2OK.style.display = total===30 ? "inline" : "none";

  /* 解答詳細用：Q2 のコードを送信 */
  if (API) {
    API.LMSSetValue("cmi.interactions.1.id", "Q2");
    API.LMSSetValue("cmi.interactions.1.student_response", code);
    API.LMSSetValue(
      "cmi.interactions.1.result",
      (hasA && usesAB && correct) ? "correct" : "wrong"
    );
  }

  updateOverall();
}

/* ---- 問3 ---- */
async function runQ3() {
  const code = q3Input.value;

  const out = await runPython(code, [String(aVal), String(bVal)]);

  q3Output.textContent = out || "(出力なし)";

  const hasInput = /input\s*\(/.test(code);
  const correct = out.includes(String(aVal + bVal));

  const total = (hasInput?10:0)+(correct?20:0);

  q3Result.innerHTML =
    `<span style="font-size:20px; font-weight:bold;">得点: ${total}/30</span>\n` +
    `・input を使っている: ${mark(hasInput)}（10点）\n` +
    `・正しい合計（${aVal + bVal}）※a=${aVal}, b=${bVal}（20点）`;

  q3OK.style.display = total===30 ? "inline" : "none";

  /* 解答詳細用：Q3 のコードを送信 */
  if (API) {
    API.LMSSetValue("cmi.interactions.2.id", "Q3");
    API.LMSSetValue("cmi.interactions.2.student_response", code);
    API.LMSSetValue(
      "cmi.interactions.2.result",
      correct ? "correct" : "wrong"
    );
  }

  updateOverall();
}

/* ---- 総合結果 ---- */
function updateOverall() {
  const s1 = parseInt(q1Result.textContent.match(/得点: (\d+)/)?.[1] || 0);
  const s2 = parseInt(q2Result.textContent.match(/得点: (\d+)/)?.[1] || 0);
  const s3 = parseInt(q3Result.textContent.match(/得点: (\d+)/)?.[1] || 0);

  const total = s1 + s2 + s3;
  const passed = (total === 90);

  /* LMS に送信 */
  if (API) {
    API.LMSSetValue("cmi.core.score.raw", String(total));
    API.LMSSetValue("cmi.core.lesson_status", passed ? "passed" : "failed");
  }

  /* suspend_data 保存（フォーム内容も保存） */
  const saveData = {
    q1:s1, q2:s2, q3:s3,
    total:total,
    passed:passed,
    a:aVal, b:bVal,
    code1:q1Input.value,
    code2:q2Input.value,
    code3:q3Input.value
  };

  if (API) {
    API.LMSSetValue("cmi.suspend_data", JSON.stringify(saveData));
    API.LMSCommit("");
  }

  /* 表示 */
  let text = `総合得点: ${total}/90`;
  if (passed) {
    text += ` <span style="color:#c62828;">合格</span>`;
  }

  resultBox.innerHTML = text;
  resultBox.style.color = "#000";
  resultBox.style.borderColor = "#0078d4";
}

/* ---- suspend_data 読み込み ---- */
function loadSuspendData() {
  if (!API) return;

  const raw = API.LMSGetValue("cmi.suspend_data");
  if (!raw) return;

  try {
    const data = JSON.parse(raw);

    /* a,b を復元 */
    if (data.a !== undefined) aVal = data.a;
    if (data.b !== undefined) bVal = data.b;

    /* フォーム内容を復元 */
    if (data.code1) q1Input.value = data.code1;
    if (data.code2) q2Input.value = data.code2;
    if (data.code3) q3Input.value = data.code3;

    /* 各問の得点復元 */
    if (data.q1 !== undefined) {
      q1Result.innerHTML = `<span style="font-size:20px; font-weight:bold;">得点: ${data.q1}/30</span>`;
      if (data.q1 === 30) q1OK.style.display = "inline";
    }
    if (data.q2 !== undefined) {
      q2Result.innerHTML = `<span style="font-size:20px; font-weight:bold;">得点: ${data.q2}/30</span>`;
      if (data.q2 === 30) q2OK.style.display = "inline";
    }
    if (data.q3 !== undefined) {
      q3Result.innerHTML =
        `<span style="font-size:20px; font-weight:bold;">得点: ${data.q3}/30</span>\n` +
        `・正しい合計（${data.a + data.b}）※a=${data.a}, b=${data.b}`;
      if (data.q3 === 30) q3OK.style.display = "inline";
    }

    /* 総合得点復元 */
    let text = `総合得点: ${data.total}/90`;
    if (data.passed) {
      text += ` <span style="color:#c62828;">合格</span>`;
    }
    resultBox.innerHTML = text;
    resultBox.style.color = "#000";
    resultBox.style.borderColor = "#0078d4";

  } catch(e) {
    console.log("suspend_data 読み込みエラー:", e);
  }
}
</script>
</body>
</html>
