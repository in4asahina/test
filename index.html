<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>二進法と十進法の変換練習</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
        }
        label {
            display: block;
            margin-top: 1em;
        }
        input[type="text"] {
            width: 200px;
            padding: 0.3em;
            font-size: 1em;
        }
        button {
            margin-left: 0.5em;
            padding: 0.3em 0.7em;
            font-size: 1em;
        }
        .result {
            margin-top: 1em;
            font-weight: bold;
            color: #0066cc;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>二進法と十進法の変換練習ページ</h1>

    <div>
        <label for="decimalInput">十進数を入力してください：</label>
        <input type="text" id="decimalInput" placeholder="例: 10">
        <button onclick="decimalToBinary()">二進数に変換</button>
        <div id="binaryResult" class="result"></div>
    </div>

    <div>
        <label for="binaryInput">二進数を入力してください：</label>
        <input type="text" id="binaryInput" placeholder="例: 1010">
        <button onclick="binaryToDecimal()">十進数に変換</button>
        <div id="decimalResult" class="result"></div>
    </div>

    <script>
        function decimalToBinary() {
            const decimalStr = document.getElementById('decimalInput').value.trim();
            const binaryResult = document.getElementById('binaryResult');
            binaryResult.classList.remove('error');

            if (!/^\d+$/.test(decimalStr)) {
                binaryResult.textContent = '有効な十進数を入力してください。';
                binaryResult.classList.add('error');
                return;
            }

            const decimalNum = parseInt(decimalStr, 10);
            const binaryStr = decimalNum.toString(2);
            binaryResult.textContent = `二進数: ${binaryStr}`;
        }

        function binaryToDecimal() {
            const binaryStr = document.getElementById('binaryInput').value.trim();
            const decimalResult = document.getElementById('decimalResult');
            decimalResult.classList.remove('error');

            if (!/^[01]+$/.test(binaryStr)) {
                decimalResult.textContent = '有効な二進数を入力してください（0と1のみ）。';
                decimalResult.classList.add('error');
                return;
            }

            const decimalNum = parseInt(binaryStr, 2);
            decimalResult.textContent = `十進数: ${decimalNum}`;
        }
    </script>
</body>
</html>
