<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>二進法と十進法の変換問題練習</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
        }
        #problem {
            font-size: 1.5em;
            margin-bottom: 1em;
        }
        label {
            font-weight: bold;
        }
        input[type="text"] {
            width: 200px;
            padding: 0.3em;
            font-size: 1em;
            margin-left: 0.5em;
        }
        button {
            margin-left: 0.5em;
            padding: 0.4em 0.8em;
            font-size: 1em;
        }
        #result {
            margin-top: 1em;
            font-weight: bold;
            font-size: 1.2em;
        }
        #result.correct {
            color: green;
        }
        #result.incorrect {
            color: red;
        }
        #explanation {
            margin-top: 1em;
            background: #f0f8ff;
            border-left: 4px solid #0066cc;
            padding: 1em;
            white-space: pre-wrap;
            font-family: "Courier New", Courier, monospace;
        }
    </style>
</head>
<body>
    <h1>二進法と十進法の変換問題練習</h1>
    <div id="problem">問題表示エリア</div>
    <label for="answerInput">答えを入力してください:</label>
    <input type="text" id="answerInput" autocomplete="off" />
    <button id="checkBtn">答え合わせ</button>
    <button id="nextBtn" disabled>次の問題</button>
    <div id="result"></div>
    <div id="explanation"></div>

    <script>
        let currentProblem = {};

        // 問題をランダムに生成（10～255の範囲で）
        function generateProblem() {
            const num = Math.floor(Math.random() * 246) + 10; // 10～255
            // 0なら十進数→二進数問題、1なら二進数→十進数問題
            const type = Math.random() < 0.5 ? 'decToBin' : 'binToDec';

            if (type === 'decToBin') {
                return {
                    question: `次の十進数を二進数に変換してください：${num}`,
                    answer: num.toString(2),
                    decimal: num,
                    type: 'decToBin'
                };
            } else {
                return {
                    question: `次の二進数を十進数に変換してください：${num.toString(2)}`,
                    answer: String(num),
                    binary: num.toString(2),
                    type: 'binToDec'
                };
            }
        }

        function normalizeAnswer(ans, type) {
            let a = ans.trim();
            if (type === 'decToBin') {
                a = a.replace(/^0+/, '') || '0';
            } else {
                a = a.replace(/^0+/, '') || '0';
            }
            return a;
        }

        // 十進数→二進数の解説を作成
        function explainDecToBin(decimal) {
            let explanation = `【解説】\n十進数 ${decimal} を二進数に変換するには、\n${decimal} を2で割り続け、余りを逆順に並べます。\n\n割り算の過程:\n`;
            let n = decimal;
            let steps = [];
            while (n > 0) {
                const remainder = n % 2;
                const quotient = Math.floor(n / 2);
                steps.push(`${n} ÷ 2 = ${quotient} 余り ${remainder}`);
                n = quotient;
            }
            // 逆順に表示
            for (let i = steps.length - 1; i >= 0; i--) {
                explanation += steps[i] + '\n';
            }
            explanation += `\n余りを下から上へ並べると二進数：${decimal.toString(2)} となります。`;
            return explanation;
        }

        // 二進数→十進数の解説を作成
        function explainBinToDec(binary) {
            let explanation = `【解説】\n二進数 ${binary} を十進数に変換するには、\n各桁の値にその桁の2のべき乗をかけて足します。\n\n計算の過程:\n`;
            const len = binary.length;
            let sum = 0;
            for (let i = 0; i < len; i++) {
                const bit = binary[len - 1 - i]; // 右端が0桁目
                const bitValue = bit === '1' ? 1 : 0;
                const power = Math.pow(2, i);
                const value = bitValue * power;
                explanation += `桁 ${len - i} (${bit}) × 2^${i} = ${value}\n`;
                sum += value;
            }
            explanation += `\nこれらを合計すると十進数：${sum} となります。`;
            return explanation;
        }

        function checkAnswer() {
            const input = document.getElementById('answerInput').value;
            const resultDiv = document.getElementById('result');
            const explanationDiv = document.getElementById('explanation');
            explanationDiv.textContent = '';
            const answerNormalized = normalizeAnswer(currentProblem.answer, currentProblem.type);
            const inputNormalized = normalizeAnswer(input, currentProblem.type);

            if (inputNormalized === answerNormalized) {
                resultDiv.textContent = '正解！';
                resultDiv.className = 'correct';
            } else {
                resultDiv.textContent = `不正解。正しい答えは「${currentProblem.answer}」です。`;
                resultDiv.className = 'incorrect';
            }

            // 解説表示
            if (currentProblem.type === 'decToBin') {
                explanationDiv.textContent = explainDecToBin(currentProblem.decimal);
            } else {
                explanationDiv.textContent = explainBinToDec(currentProblem.binary);
            }

            document.getElementById('checkBtn').disabled = true;
            document.getElementById('nextBtn').disabled = false;
        }

        function nextProblem() {
            currentProblem = generateProblem();
            document.getElementById('problem').textContent = currentProblem.question;
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').focus();
            document.getElementById('result').textContent = '';
            document.getElementById('explanation').textContent = '';
            document.getElementById('checkBtn').disabled = false;
            document.getElementById('nextBtn').disabled = true;
        }

        document.getElementById('checkBtn').addEventListener('click', checkAnswer);
        document.getElementById('nextBtn').addEventListener('click', nextProblem);

        window.onload = nextProblem;
    </script>
</body>
</html>
